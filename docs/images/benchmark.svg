<svg xmlns="http://www.w3.org/2000/svg" width="760" height="362" viewBox="0 0 760 362" role="img" aria-labelledby="title desc">
  <title id="title">paw compared with gzip, bzip2 and xz on the Silesia corpus</title>
  <desc id="desc">How much smaller (negative) or larger (positive) paw's compressed file is than each tool's, file by file. reymont: gzip -9 -41.8%, bzip2 -9 -14.8%, xz -9 -19.4%; nci: gzip -9 -52.6%, bzip2 -9 -21.9%, xz -9 -18.6%; mr: gzip -9 -38.2%, bzip2 -9 -7.4%, xz -9 -17.8%; dickens: gzip -9 -38.2%, bzip2 -9 -14.9%, xz -9 -15.9%; webster: gzip -9 -40.1%, bzip2 -9 -16.3%, xz -9 -13.7%; osdb: gzip -9 -32.5%, bzip2 -9 -11.6%, xz -9 -13.1%; x-ray: gzip -9 -35.4%, bzip2 -9 -3.6%, xz -9 -13.0%; ooffice: gzip -9 -23.6%, bzip2 -9 -17.5%, xz -9 -2.7%; xml: gzip -9 -32.3%, bzip2 -9 +1.1%, xz -9 -1.6%; sao: gzip -9 -9.2%, bzip2 -9 -2.2%, xz -9 +9.5%; samba: gzip -9 -16.8%, bzip2 -9 -1.2%, xz -9 +19.5%; mozilla: gzip -9 -7.4%, bzip2 -9 -1.5%, xz -9 +31.9%.</desc>
  <style>
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2328; }
    .muted { fill: #59636e; }
    .small { font-size: 11px; }
    .end { text-anchor: end; }
    .mid { text-anchor: middle; }
    .head { font-weight: 600; }
    .win { fill: #1f883d; }
    .wint { fill: #1a7f37; font-weight: 600; }
    .loss { fill: #c4ccd5; }
    .stripe { fill: #f6f8fa; }
    .axis { stroke: #8c959f; stroke-width: 1; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .muted { fill: #9198a1; }
      .win { fill: #2ea043; }
      .wint { fill: #3fb950; }
      .loss { fill: #4a525c; }
      .stripe { fill: #151b23; }
      .axis { stroke: #6e7681; }
    }
  </style>

