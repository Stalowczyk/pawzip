<svg xmlns="http://www.w3.org/2000/svg" width="760" height="276" viewBox="0 0 760 276" role="img" aria-labelledby="title desc">
  <title id="title">Leftover gaps only count free slots</title>
  <desc id="desc">In A B A B A B A B C A A C, positions 1, 3, 5 and 7 already belong to B. The 8 remaining positions are free slots. C is in free slots 4 and 7, so its gaps are 4 and 2 instead of 8 and 2.</desc>
  <style>
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .muted { fill: #59636e; }
    .small { font-size: 12px; }
    .letter { font-size: 18px; text-anchor: middle; }
    .center { text-anchor: middle; }
    .bold { font-weight: 600; }
    .title { font-size: 15px; font-weight: 600; }
    .a { fill: #f6f8fa; stroke: #d1d9e0; }
    .taken { fill: #ddf4ff; stroke: #54aeff; stroke-dasharray: 4 3; opacity: 0.55; }
    .c { fill: #fff1e5; stroke: #fb8f44; }
    .at { fill: #59636e; }
    .bt { fill: #0969da; }
    .ct { fill: #bc4c00; }
    .link { stroke: #d1d9e0; stroke-width: 1.2; }
    .brace { fill: none; stroke: #bc4c00; stroke-width: 1.5; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .muted, .at { fill: #9198a1; }
      .a { fill: #151b23; stroke: #3d444d; }
      .taken { fill: #0d2a4d; stroke: #388bfd; }
      .c { fill: #2d1a0a; stroke: #db6d28; }
      .bt { fill: #58a6ff; }
      .ct { fill: #f0883e; }
      .link { stroke: #3d444d; }
      .brace { stroke: #f0883e; }
    }
  </style>

  <text x="20" y="22" class="title">Leftover gaps only count free slots</text>
  <text x="20" y="42" class="muted small">B's positions are already taken, so C's gaps skip them</text>

  <!-- all positions -->
  <text x="20" y="82" class="muted">data</text>
  <g>
    <rect x="120" y="56" width="44" height="40" rx="6" class="a"/><text x="142" y="82" class="mono letter at">A</text>
    <rect x="172" y="56" width="44" height="40" rx="6" class="taken"/><text x="194" y="82" class="mono letter bt" opacity="0.6">B</text>
    <rect x="224" y="56" width="44" height="40" rx="6" class="a"/><text x="246" y="82" class="mono letter at">A</text>
    <rect x="276" y="56" width="44" height="40" rx="6" class="taken"/><text x="298" y="82" class="mono letter bt" opacity="0.6">B</text>
    <rect x="328" y="56" width="44" height="40" rx="6" class="a"/><text x="350" y="82" class="mono letter at">A</text>
    <rect x="380" y="56" width="44" height="40" rx="6" class="taken"/><text x="402" y="82" class="mono letter bt" opacity="0.6">B</text>
    <rect x="432" y="56" width="44" height="40" rx="6" class="a"/><text x="454" y="82" class="mono letter at">A</text>
    <rect x="484" y="56" width="44" height="40" rx="6" class="taken"/><text x="506" y="82" class="mono letter bt" opacity="0.6">B</text>
    <rect x="536" y="56" width="44" height="40" rx="6" class="c"/><text x="558" y="82" class="mono letter ct">C</text>
    <rect x="588" y="56" width="44" height="40" rx="6" class="a"/><text x="610" y="82" class="mono letter at">A</text>
    <rect x="640" y="56" width="44" height="40" rx="6" class="a"/><text x="662" y="82" class="mono letter at">A</text>
    <rect x="692" y="56" width="44" height="40" rx="6" class="c"/><text x="714" y="82" class="mono letter ct">C</text>
  </g>
  <g class="mono small muted">
    <text x="142" y="114" class="center">0</text><text x="194" y="114" class="center">1</text>
    <text x="246" y="114" class="center">2</text><text x="298" y="114" class="center">3</text>
    <text x="350" y="114" class="center">4</text><text x="402" y="114" class="center">5</text>
    <text x="454" y="114" class="center">6</text><text x="506" y="114" class="center">7</text>
    <text x="558" y="114" class="center">8</text><text x="610" y="114" class="center">9</text>
    <text x="662" y="114" class="center">10</text><text x="714" y="114" class="center">11</text>
  </g>

  <!-- each free slot moves down to the compact row -->
  <g class="link">
    <line x1="142" y1="122" x2="142" y2="166"/>
    <line x1="246" y1="122" x2="194" y2="166"/>
    <line x1="350" y1="122" x2="246" y2="166"/>
    <line x1="454" y1="122" x2="298" y2="166"/>
    <line x1="558" y1="122" x2="350" y2="166"/>
    <line x1="610" y1="122" x2="402" y2="166"/>
    <line x1="662" y1="122" x2="454" y2="166"/>
    <line x1="714" y1="122" x2="506" y2="166"/>
  </g>

  <!-- free slots only -->
  <text x="20" y="196" class="muted">free slots</text>
  <g>
    <rect x="120" y="170" width="44" height="40" rx="6" class="a"/><text x="142" y="196" class="mono letter at">A</text>
    <rect x="172" y="170" width="44" height="40" rx="6" class="a"/><text x="194" y="196" class="mono letter at">A</text>
    <rect x="224" y="170" width="44" height="40" rx="6" class="a"/><text x="246" y="196" class="mono letter at">A</text>
    <rect x="276" y="170" width="44" height="40" rx="6" class="a"/><text x="298" y="196" class="mono letter at">A</text>
    <rect x="328" y="170" width="44" height="40" rx="6" class="c"/><text x="350" y="196" class="mono letter ct">C</text>
    <rect x="380" y="170" width="44" height="40" rx="6" class="a"/><text x="402" y="196" class="mono letter at">A</text>
    <rect x="432" y="170" width="44" height="40" rx="6" class="a"/><text x="454" y="196" class="mono letter at">A</text>
    <rect x="484" y="170" width="44" height="40" rx="6" class="c"/><text x="506" y="196" class="mono letter ct">C</text>
  </g>

  <!-- the gaps -->
  <path d="M122 220 v6 h196 v-6" class="brace"/>
  <text x="220" y="246" class="center bold ct">skip 4</text>
  <path d="M382 220 v6 h92 v-6" class="brace"/>
  <text x="428" y="246" class="center bold ct">skip 2</text>

  <text x="560" y="186"><tspan class="bold ct">C's gaps: 4, 2</tspan></text>
  <text x="560" y="210" class="muted small">counting every position: 8, 2</text>
  <text x="560" y="230" class="muted small">smaller numbers take fewer bits</text>
</svg>
