[package]
name = "pawzip-py"
description = "Python bindings for the pawzip core (the native part of the pawzip package)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lib]
name = "_core"
crate-type = ["cdylib"]

[dependencies]
pawzip = { path = "../pawzip" }
# abi3: one wheel per platform for every Python from 3.10 on
pyo3 = { version = "0.23", features = ["abi3-py310"] }
