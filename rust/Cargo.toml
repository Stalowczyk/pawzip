[workspace]
members = ["pawzip", "pawzip-py", "pawzip-cli"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["Pawel Stalowczyk"]
repository = "https://github.com/Stalowczyk/pawzip"
rust-version = "1.87"

[profile.release]
codegen-units = 1
lto = true
