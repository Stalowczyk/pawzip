[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "pawzip"
dynamic = ["version"]
description = "Lossless compressor that records where each byte value occurs and describes those positions with series. Writes .paw files."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pawel Stalowczyk" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = ["compression", "compressor", "lossless", "file format", "burrows-wheeler", "range coder"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: System :: Archiving :: Compression",
    "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/Stalowczyk/pawzip"
Issues = "https://github.com/Stalowczyk/pawzip/issues"
Changelog = "https://github.com/Stalowczyk/pawzip/blob/main/CHANGELOG.md"
"Format specification" = "https://github.com/Stalowczyk/pawzip/blob/main/spec/FORMAT.md"

[project.optional-dependencies]
dev = ["maturin>=1.7,<2", "pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.10", "pre-commit>=3", "build>=1", "twine>=5"]

[project.scripts]
paw = "paw.cli:main"

# The package is pure Python plus one native module, paw._core, built from rust/pawzip-py.
# The version comes from the Rust workspace (rust/Cargo.toml) and must match paw.__version__.
[tool.maturin]
manifest-path = "../rust/pawzip-py/Cargo.toml"
python-source = "src"
module-name = "paw._core"
features = ["pyo3/extension-module"]
exclude = ["**/__pycache__/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = ["--strict-markers", "--import-mode=importlib"]
markers = ["slow: larger inputs; deselect with -m 'not slow'"]

[tool.coverage.run]
source = ["paw"]
branch = true
omit = ["*/paw/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:"]
fail_under = 95

[tool.mypy]
strict = true
files = ["src/paw", "tests/typing_open.py"]
