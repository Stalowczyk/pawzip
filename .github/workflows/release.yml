name: Release

# Pushing a tag vX.Y.Z builds the wheels, the source package and the npm package and tests each
# of them, uploads the Python files to TestPyPI, and after approval in the "pypi", "crates-io"
# and "npm" environments (all three wait at the same time, so one review approves them) uploads
# the same files to PyPI, publishes the Rust crates to crates.io and the npm package to npm, and
# creates the GitHub release. Nothing is published unless all of these were built and tested.
# Started by hand, it only builds and tests.
#
# Before the first release with npm: create the "npm" environment with required reviewers, like
# "pypi" (an environment a job names is otherwise created without protection). npm's trusted
# publishing can only be set up for a package that exists, so publish the first version by hand,
# from this run's npm-package artifact, while the release waits for approval (the npm job skips a
# version already on npm). Add this workflow as the package's trusted publisher, allowed to run
# npm publish, shortly before the next release: one that hasn't published within 2 days expires.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check the version
    if: github.repository == 'Stalowczyk/pawzip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag, package version and changelog agree
        run: |
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' rust/Cargo.toml | head -n 1)
          python=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' python/src/paw/__init__.py)
          npm=$(node -p 'require("./js/package.json").version')
          echo "rust/Cargo.toml: $cargo, paw.__version__: $python, js/package.json: $npm"
          [ "$cargo" = "$python" ] || { echo "::error::rust/Cargo.toml and paw.__version__ differ"; exit 1; }
          [ "$cargo" = "$npm" ] || { echo "::error::rust/Cargo.toml and js/package.json differ"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$GITHUB_REF_NAME" = "v$cargo" ] || { echo "::error::tag $GITHUB_REF_NAME is not v$cargo"; exit 1; }
            grep -Fq "## [$cargo] - " CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [$cargo] - date' section"; exit 1; }
          fi

  wheels:
    name: Wheel (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64 }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64 }
          - { name: windows-x64, runner: windows-latest, target: x64 }
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64 }
          - { name: macos-arm64, runner: macos-latest, target: aarch64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
      # One abi3 wheel serves every Python from 3.10 on: test it on the oldest and the newest.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - name: Test on Python 3.10
        run: |
          python -m pip install numpy pytest hypothesis
          python -m pip install --no-index --find-links python/dist pawzip
          python -c "import paw, paw.blocks; assert paw.blocks.NATIVE; print(paw.__version__, paw.__file__)"
          python -m pytest python -q
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Test on Python 3.15
        run: |
          python -m pip install numpy pytest hypothesis
          python -m pip install --no-index --find-links python/dist pawzip
          python -c "import paw, paw.blocks; assert paw.blocks.NATIVE; print(paw.__version__, paw.__file__)"
          python -m pytest python -q
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.name }}
          path: python/dist/*.whl

  sdist:
    name: Source package
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Build
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - name: Test that it builds from source and passes the tests
        run: |
          python -m pip install pytest hypothesis
          python -m pip install python/dist/*.tar.gz
          python -c "import paw, paw.blocks; assert paw.blocks.NATIVE; print(paw.__version__, paw.__file__)"
          python -m pytest python -q
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist
          path: python/dist/*.tar.gz

  npm-package:
    name: npm package
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/wasm-toolchain
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      # No npm ci: the build and the tests need nothing from npm, so nothing from it is run
      # while making the package that's published.
      - run: npm run build
      - run: npm test
      - run: npm pack
      # Not named dist-*: those are the Python files, uploaded to PyPI.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: js/pawzip-*.tgz

  testpypi:
    name: Upload to TestPyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist, npm-package] # every package, so none is published without the others
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pawzip/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true  # TestPyPI never takes a file twice; lets a failed release be re-run

  pypi:
    name: Upload to PyPI
    needs: testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi  # requires approval
      url: https://pypi.org/project/pawzip/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  crates-io:
    name: Upload to crates.io
    needs: testpypi
    runs-on: ubuntu-latest
    environment:
      name: crates-io  # requires approval
      url: https://crates.io/crates/pawzip
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish pawzip, then pawzip-cli (skipping a version already there, for re-runs)
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          for crate in pawzip pawzip-cli; do
            if curl -sf -A "pawzip release (github.com/Stalowczyk/pawzip)" \
                "https://crates.io/api/v1/crates/$crate/$version" > /dev/null; then
              echo "$crate $version is already on crates.io"
            else
              cargo publish -p "$crate"
            fi
          done

  npm:
    name: Upload to npm
    needs: [testpypi, npm-package]
    runs-on: ubuntu-latest
    environment:
      name: npm  # requires approval
      url: https://www.npmjs.com/package/pawzip
    permissions:
      id-token: write  # trusted publishing, which also adds provenance
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"  # its npm is newer than the 11.5.1 that trusted publishing needs
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
      - name: Publish pawzip (skipping a version already there, for re-runs)
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "pawzip@$version" version > /dev/null 2>&1; then
            echo "pawzip $version is already on npm"
          else
            npm publish "pawzip-$version.tgz"
          fi

  github-release:
    name: GitHub release
    needs: [pypi, crates-io, npm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: dist
      - name: Create the release from the changelog section, with the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # GitHub shows every line break in release notes, so each wrapped paragraph and list item
          # of the changelog section is joined onto one line.
          awk -v head="## [$version] - " '
            index($0, head) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on {
              if ($0 == "" || prev == "" || $0 ~ /^#/ || prev ~ /^#/ || $0 ~ /^[ \t]*([-*+]|[0-9]+\.)[ \t]/) {
                if (n++) print buf
                buf = $0
              } else {
                line = $0; sub(/^[ \t]+/, "", line); buf = buf " " line
              }
              prev = $0
            }
            END { if (n) print buf }
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "pawzip $version" --notes-file notes.md
