name: Release

# Pushing a tag vX.Y.Z builds the wheels and the source package and tests each of them, uploads
# them to TestPyPI, and after approval in the "pypi" environment uploads the same files to PyPI
# and creates the GitHub release. Started by hand, it only builds and tests.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check the version
    if: github.repository == 'Stalowczyk/pawzip'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Tag, package version and changelog agree
        run: |
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' rust/Cargo.toml | head -n 1)
          python=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' python/src/paw/__init__.py)
          echo "rust/Cargo.toml: $cargo, paw.__version__: $python"
          [ "$cargo" = "$python" ] || { echo "::error::rust/Cargo.toml and paw.__version__ differ"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "$GITHUB_REF_NAME" = "v$cargo" ] || { echo "::error::tag $GITHUB_REF_NAME is not v$cargo"; exit 1; }
            grep -Fq "## [$cargo] - " CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## [$cargo] - date' section"; exit 1; }
          fi

  wheels:
    name: Wheel (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-latest, target: x86_64 }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64 }
          - { name: windows-x64, runner: windows-latest, target: x64 }
          - { name: macos-x86_64, runner: macos-15-intel, target: x86_64 }
          - { name: macos-arm64, runner: macos-latest, target: aarch64 }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
      # One abi3 wheel serves every Python from 3.10 on: test it on the oldest and the newest.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Test on Python 3.10
        run: |
          python -m pip install numpy pytest hypothesis
          python -m pip install --no-index --find-links python/dist pawzip
          python -c "import paw, paw.blocks; assert paw.blocks.NATIVE; print(paw.__version__, paw.__file__)"
          python -m pytest python -q
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Test on Python 3.14
        run: |
          python -m pip install numpy pytest hypothesis
          python -m pip install --no-index --find-links python/dist pawzip
          python -c "import paw, paw.blocks; assert paw.blocks.NATIVE; print(paw.__version__, paw.__file__)"
          python -m pytest python -q
      - uses: actions/upload-artifact@v6
        with:
          name: dist-${{ matrix.name }}
          path: python/dist/*.whl

  sdist:
    name: Source package
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - name: Test that it builds from source and passes the tests
        run: |
          python -m pip install pytest hypothesis
          python -m pip install python/dist/*.tar.gz
          python -c "import paw, paw.blocks; assert paw.blocks.NATIVE; print(paw.__version__, paw.__file__)"
          python -m pytest python -q
      - uses: actions/upload-artifact@v6
        with:
          name: dist-sdist
          path: python/dist/*.tar.gz

  testpypi:
    name: Upload to TestPyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pawzip/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true  # TestPyPI never takes a file twice; lets a failed release be re-run

  pypi:
    name: Upload to PyPI
    needs: testpypi
    runs-on: ubuntu-latest
    environment:
      name: pypi  # requires approval
      url: https://pypi.org/project/pawzip/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Create the release from the changelog section, with the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # GitHub shows every line break in release notes, so each wrapped paragraph and list item
          # of the changelog section is joined onto one line.
          awk -v head="## [$version] - " '
            index($0, head) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on {
              if ($0 == "" || prev == "" || $0 ~ /^#/ || prev ~ /^#/ || $0 ~ /^[ \t]*([-*+]|[0-9]+\.)[ \t]/) {
                if (n++) print buf
                buf = $0
              } else {
                line = $0; sub(/^[ \t]+/, "", line); buf = buf " " line
              }
              prev = $0
            }
            END { if (n) print buf }
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "pawzip $version" --notes-file notes.md
