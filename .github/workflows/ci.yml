name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"  # weekly: long property-based run
  workflow_dispatch:

# The jobs skip private forks unless started by hand.
jobs:
  lint:
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -e "python[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
        working-directory: python
      - name: Build and check the package
        working-directory: python
        run: python -m build && twine check --strict dist/*

  commits:
    name: commit messages
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install pre-commit
      - name: Every commit of the pull request passes the commit-msg hooks
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --reverse "$BASE..$HEAD"); do
            git log -1 --format=%B "$sha" > "$RUNNER_TEMP/message"
            if ! pre-commit run --hook-stage commit-msg --commit-msg-filename "$RUNNER_TEMP/message"; then
              echo "::error::commit $sha: $(head -n 1 "$RUNNER_TEMP/message")"
              status=1
            fi
          done
          exit $status

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: ubuntu-latest, python: "3.15" }
          - { os: windows-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    env:
      HYPOTHESIS_PROFILE: ${{ github.event_name == 'schedule' && 'thorough' || 'default' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "python[dev]"  # builds the Rust core (paw._core) too
      - run: pytest python --cov --cov-report=term
      - name: Pure-Python reference (the test oracle), on the oldest and a recent Python
        if: matrix.os == 'ubuntu-latest' && (matrix.python == '3.10' || matrix.python == '3.13')
        run: pytest python -q
        env:
          PAW_PURE: "1"

  rust:
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release -p pawzip -p pawzip-cli
      - name: The library's docs build without warnings
        run: cargo doc --no-deps -p pawzip
        env:
          RUSTDOCFLAGS: -D warnings
      - name: The published crates build with the oldest supported Rust (rust-version)
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          cargo "+$msrv" check -p pawzip -p pawzip-cli

  # The npm package, built once and tested on the newest and the oldest Node.js it supports, in
  # a browser, and in Deno and Bun.
  js:
    name: npm package
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/wasm-toolchain
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - name: The types
        run: npm run check
      - name: In headless Chrome
        run: npm run test:browser
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.12.0"
      - name: On the oldest supported Node.js
        run: npm test
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: In Deno
        run: deno run test/smoke.js
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: In Bun
        run: bun test/smoke.js
